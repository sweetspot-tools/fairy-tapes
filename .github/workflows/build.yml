# Fairy Tapes — Build VST3 plugins on Linux, Windows, macOS.
# Runs on push/PR to master. VST3 SDK is a git submodule (vendors/vst3sdk).
# Free tier: 2000 min/month (Linux 1x, Windows 2x, macOS 10x per minute).

name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runner: ubuntu-24.04
          - os: windows-latest
            runner: windows-latest
          - os: macos-latest
            runner: macos-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # VSTGUI4 (plugin editors) needs X11/XCB, Wayland, Cairo/Pango and, for the
      # standalone library the SDK always configures, gtkmm and sqlite.
      - name: Install VSTGUI dependencies (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev libfreetype-dev libfontconfig1-dev libpango1.0-dev \
            libxcb1-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libwayland-dev wayland-protocols \
            libglib2.0-dev libgtkmm-3.0-dev libsqlite3-dev libexpat1-dev

      - name: Configure and build (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Configure and build (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake -B build -A x64
          cmake --build build --config Release

      - name: Configure and build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-24.04' && success()
        uses: actions/upload-artifact@v4
        with:
          name: the-stripper-linux
          path: dist/TheStripper.vst3

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: the-stripper-windows
          path: dist/TheStripper.vst3

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: the-stripper-macos
          path: dist/TheStripper.vst3

      - name: Upload Pillow Talk (Linux)
        if: matrix.os == 'ubuntu-24.04' && success()
        uses: actions/upload-artifact@v4
        with:
          name: pillow-talk-linux
          path: dist/PillowTalk.vst3

      - name: Upload Pillow Talk (Windows)
        if: matrix.os == 'windows-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: pillow-talk-windows
          path: dist/PillowTalk.vst3

      - name: Upload Pillow Talk (macOS)
        if: matrix.os == 'macos-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: pillow-talk-macos
          path: dist/PillowTalk.vst3

      - name: Upload Deep Throat (Linux)
        if: matrix.os == 'ubuntu-24.04' && success()
        uses: actions/upload-artifact@v4
        with:
          name: deep-throat-linux
          path: dist/DeepThroat.vst3

      - name: Upload Deep Throat (Windows)
        if: matrix.os == 'windows-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: deep-throat-windows
          path: dist/DeepThroat.vst3

      - name: Upload Deep Throat (macOS)
        if: matrix.os == 'macos-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: deep-throat-macos
          path: dist/DeepThroat.vst3
