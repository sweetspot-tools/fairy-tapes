<!doctype html>
<html><head><meta charset="utf-8"><title>Stripper preview</title>
<style>
body{margin:0;padding:16px;background:#e9e8e4;font-family:system-ui,sans-serif;color:#222}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px;font-size:13px}
button{font:inherit;padding:4px 10px;border:1px solid #888;background:#fff;border-radius:6px;cursor:pointer}
.stage{display:flex;justify-content:center;background:#d8d6d0;border-radius:12px;padding:16px}
</style></head><body>
<div class="bar">
  <label><input type="checkbox" id="anim" checked> Anima i meter</label>
  <label>Segnale <input type="range" id="lvl" min="0" max="100" value="55" style="width:120px"></label>
  <span style="color:#555">Clic su un LED di clip: azzera tutti. Manopole: trascina in verticale.</span>
</div>
<div class="stage"><svg id="ui" width="480" height="780" viewBox="0 0 480 780" role="img" aria-label="Editor di The Stripper con meter"></svg></div>
<script>
var NS='http://www.w3.org/2000/svg',svg=document.getElementById('ui');
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e;}
var INK='#e8e2d4',DIM='#9a9384',AMB='#d9a441',LINE='#4a463e',BODY='#171614',RED='#e0463a',GRN='#5cc06c';
function txt(s,x,y,sz,col,anchor,w,p){var t=el('text',{x:x,y:y,'font-size':sz,fill:col,'text-anchor':anchor||'middle','font-weight':w||400,'font-family':'system-ui,Helvetica,Arial,sans-serif'},p);t.textContent=s;return t;}
function polar(cx,cy,r,deg){var a=deg*Math.PI/180;return [cx+r*Math.cos(a),cy-r*Math.sin(a)];}
function arc(cx,cy,r,d0,d1){var p0=polar(cx,cy,r,d0),p1=polar(cx,cy,r,d1);return 'M'+p0[0]+' '+p0[1]+' A'+r+' '+r+' 0 '+((d0-d1)>180?1:0)+' 1 '+p1[0]+' '+p1[1];}
el('rect',{x:0,y:0,width:480,height:780,rx:8,fill:'#2a2926'});
el('rect',{x:3,y:3,width:474,height:774,rx:6,fill:'none',stroke:LINE});
txt('THE STRIPPER',24,34,18,INK,'start',500);
txt('Fairy Tapes',24,49,11,DIM,'start');

function btn(x,y,w,label,on,cb){
  var g=el('g',{style:'cursor:pointer'});
  var r=el('rect',{x:x,y:y,width:w,height:24,rx:4,stroke:'#6b675e'},g);
  var t=txt(label,x+w/2,y+16,11,INK,'middle',500,g);
  g._on=on;
  g._paint=function(o){r.setAttribute('fill',o?AMB:BODY);t.setAttribute('fill',o?'#2a1d05':INK);};
  g._paint(on);g.addEventListener('click',function(){cb(g);});return g;
}
function knob(cx,cy,label,v,sub){
  var g=el('g',{style:'cursor:ns-resize'});
  el('path',{d:arc(cx,cy,24,225,-45),fill:'none',stroke:LINE,'stroke-width':3,'stroke-linecap':'round'},g);
  var val=el('path',{fill:'none',stroke:AMB,'stroke-width':3,'stroke-linecap':'round'},g);
  el('circle',{cx:cx,cy:cy,r:17,fill:BODY,stroke:'#6b675e'},g);
  var ind=el('line',{stroke:INK,'stroke-width':2,'stroke-linecap':'round'},g);
  var hit=el('circle',{cx:cx,cy:cy,r:28,fill:'transparent'},g);
  txt(label,cx,cy+42,11,INK,'middle',400,g);txt(sub||'',cx,cy+54,11,DIM,'middle',400,g);
  function draw(){var ang=225-270*v,a=polar(cx,cy,5,ang),b=polar(cx,cy,15,ang);ind.setAttribute('x1',a[0]);ind.setAttribute('y1',a[1]);ind.setAttribute('x2',b[0]);ind.setAttribute('y2',b[1]);val.setAttribute('d',v<0.005?'':arc(cx,cy,24,225,ang));}
  draw();var y0=0,v0=0,drag=false;
  hit.addEventListener('pointerdown',function(e){drag=true;y0=e.clientY;v0=v;hit.setPointerCapture(e.pointerId);});
  hit.addEventListener('pointermove',function(e){if(!drag)return;v=Math.max(0,Math.min(1,v0+(y0-e.clientY)/(e.shiftKey?2000:200)));draw();});
  hit.addEventListener('pointerup',function(){drag=false;});
  hit.addEventListener('dblclick',function(){v=0.5;draw();});
}
function section(title,y){txt(title,24,y,11,DIM,'start',500);el('line',{x1:24+title.length*7+8,y1:y-4,x2:456,y2:y-4,stroke:LINE});}
var cx=[62,138,214,290,366,442];

var chan,mix,modeBtns=[];
function setMode(m){chan._on=m==='c';mix._on=m==='m';chan._paint(chan._on);mix._paint(mix._on);modeBtns.forEach(function(b){b.style.opacity=m==='c'?1:0.2;b.style.pointerEvents=m==='c'?'auto':'none';});}
chan=btn(300,18,76,'Channel',true,function(){setMode('c');});
mix=btn(380,18,76,'Mix bus',false,function(){setMode('m');});

/* ---- meter strip ---- */
var SEG=24;
function peakBar(x,y,w,label){
  txt(label,x,y+8,11,DIM,'start',500);
  var rows=[];
  for(var r=0;r<2;r++){
    var segs=[];var sw=(w-26)/SEG;
    for(var i=0;i<SEG;i++){segs.push(el('rect',{x:x+26+i*sw,y:y+r*9,width:sw-1.4,height:7,rx:1,fill:'#34322d'}));}
    rows.push(segs);
  }
  var hold=[el('rect',{y:y,width:2,height:7,fill:INK}),el('rect',{y:y+9,width:2,height:7,fill:INK})];
  return {rows:rows,hold:hold,x:x+26,sw:(w-26)/SEG};
}
function colorFor(i){var db=-60+i*(66/SEG);return db>=0?RED:(db>=-12?AMB:GRN);}
function setPeak(m,ch,db,holdDb){
  var n=Math.max(0,Math.min(SEG,Math.round((db+60)/66*SEG)));
  m.rows[ch].forEach(function(s,i){s.setAttribute('fill',i<n?colorFor(i):'#34322d');});
  var hx=m.x+Math.max(0,Math.min(SEG-1,Math.round((holdDb+60)/66*SEG)))*m.sw;
  m.hold[ch].setAttribute('x',hx);
}
function grBar(x,y,w,label,maxDb){
  txt(label,x,y+8,11,DIM,'start',500);
  var segs=[];var sw=(w-42)/16;
  for(var i=0;i<16;i++){segs.push(el('rect',{x:x+42+i*sw,y:y,width:sw-1.4,height:7,rx:1,fill:'#34322d'}));}
  return {segs:segs,max:maxDb};
}
function setGr(g,db){var n=Math.round(Math.min(db,g.max)/g.max*16);g.segs.forEach(function(s,i){s.setAttribute('fill',i<n?(i>11?RED:AMB):'#34322d');});}
var mIn=peakBar(24,66,206,'IN'),mOut=peakBar(250,66,206,'OUT');
var gC=grBar(24,96,206,'COMP',20),gL=grBar(250,96,206,'LIM',12);
var clipNames=['IN','EQ','CMP','DRV','LIM','OUT'],clips=[],clipOn=[0,0,0,0,0,0];
clipNames.forEach(function(n,i){
  var x=24+i*72;var g=el('g',{style:'cursor:pointer'});
  var d=el('circle',{cx:x+4,cy:118,r:4.2,fill:'#34322d',stroke:'#6b675e'},g);
  txt(n,x+13,122,11,DIM,'start',500,g);
  g.addEventListener('click',function(){clipOn=[0,0,0,0,0,0];paintClips();});
  clips.push(d);
});
function paintClips(){clips.forEach(function(d,i){d.setAttribute('fill',clipOn[i]>0?RED:'#34322d');});}
txt('CLIP',0,0,1,'transparent');
el('line',{x1:14,y1:132,x2:466,y2:132,stroke:LINE});

/* ---- controls (shifted +60) ---- */
section('INPUT / FILTERS',152);
knob(cx[0],192,'Input',0.5,'0 dB');knob(cx[1],192,'Output',0.5,'0 dB');
knob(cx[2],192,'HPF',0.25,'80 Hz');knob(cx[3],192,'LPF',0.85,'16 kHz');
var t1=btn(cx[4]-29,180,58,'HPF',true,function(g){g._on=!g._on;g._paint(g._on);});
var t2=btn(cx[5]-29,180,58,'LPF',false,function(g){g._on=!g._on;g._paint(g._on);});

section('EQ',262);
knob(cx[0],302,'LF gain',0.5,'0 dB');knob(cx[1],302,'LF freq',0.4,'100 Hz');knob(cx[2],302,'LM gain',0.57,'+1.5 dB');
knob(cx[3],302,'LM freq',0.45,'900 Hz');knob(cx[4],302,'LM Q',0.4,'1.2');knob(cx[5],302,'Sat',0.2,'20 %');
knob(cx[0],386,'HM gain',0.63,'+3 dB');knob(cx[1],386,'HM freq',0.5,'3.2 kHz');knob(cx[2],386,'HM Q',0.4,'1.2');
knob(cx[3],386,'HF gain',0.5,'0 dB');knob(cx[4],386,'HF freq',0.6,'10 kHz');
btn(cx[5]-29,374,58,'Bell',false,function(g){g._on=!g._on;g._paint(g._on);});

section('COMPRESSION',452);
knob(cx[0],492,'Amount',0.45,'45 %');knob(cx[1],492,'Mix',1,'100 %');
['Voice','Drums','Classic'].forEach(function(n,i){
  var b=btn(cx[2]-29+i*76,480,58,n,i===0,function(){modeBtns.forEach(function(m,j){m._on=(j===i);m._paint(m._on);});});
  modeBtns.push(b);
});

section('DRIVE (NAM)',558);
knob(cx[0],598,'Drive',0.3,'0.3');
btn(cx[1]-29,586,58,'Drive',true,function(g){g._on=!g._on;g._paint(g._on);});
el('rect',{x:196,y:584,width:170,height:26,rx:4,fill:'#0f0e0d',stroke:LINE});
txt('JCM_clean_v2.nam',206,601,11,AMB,'start',500);
btn(cx[5]-29,586,58,'Load .nam',false,function(){});
txt('GPU active',196,628,11,DIM,'start');

section('LIMITER / GATE',664);
knob(cx[0],704,'Pound',0.4,'0.4');knob(cx[1],704,'Thresh',0.2,'-48 dB');
btn(cx[2]-29,692,58,'Limit',true,function(g){g._on=!g._on;g._paint(g._on);});
btn(cx[3]-29,692,58,'Gate',true,function(g){g._on=!g._on;g._paint(g._on);});
setMode('c');

/* ---- simulated signal ---- */
var t=0,holdL=[-60,-60],holdO=[-60,-60],holdT=[0,0,0,0],lvl=[-60,-60],lvlO=[-60,-60],grc=0,grl=0;
setInterval(function(){
  if(!document.getElementById('anim').checked)return;
  t+=0.033;var amt=document.getElementById('lvl').value/100;
  var env=Math.max(0,Math.sin(t*3.1))*Math.max(0,Math.sin(t*0.7+1));
  var base=-34+amt*40+env*14-(Math.sin(t*9)*3);
  var inDb=[base+Math.sin(t*5)*1.5,base-1.2+Math.cos(t*4)*1.5];
  var grTarget=Math.max(0,(base+4-(-16))*0.45);
  grc+= (grTarget-grc)*(grTarget>grc?0.5:0.08);
  var outDb=[inDb[0]-grc*0.4+3,inDb[1]-grc*0.4+3];
  var grlT=Math.max(0,(outDb[0]+3)*0.8);grl+=(grlT-grl)*(grlT>grl?0.6:0.1);
  var fin=[inDb[0]-grl,inDb[1]-grl];
  for(var c=0;c<2;c++){
    lvl[c]=Math.max(inDb[c],lvl[c]-0.66);holdL[c]=inDb[c]>holdL[c]?inDb[c]:holdL[c]-0.05;
    lvlO[c]=Math.max(fin[c],lvlO[c]-0.66);holdO[c]=fin[c]>holdO[c]?fin[c]:holdO[c]-0.05;
    setPeak(mIn,c,lvl[c],holdL[c]);setPeak(mOut,c,lvlO[c],holdO[c]);
  }
  setGr(gC,grc);setGr(gL,grl);
  var stage=[inDb[0],inDb[0]+1,inDb[0]-grc*0.4+2,outDb[0]+4,fin[0],fin[0]];
  stage.forEach(function(d,i){if(d>=0)clipOn[i]=60;else if(clipOn[i]>0)clipOn[i]--;});
  paintClips();
},33);
</script></body></html>
