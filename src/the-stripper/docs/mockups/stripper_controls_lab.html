</style></head><body>
<div class="bar">

  <button id="reroll">Re-roll</button>
  <span style="color:#555;max-width:900px">Controls lab: three materials for knobs and push buttons, each big and at real size. Worn edges are concentrated on the finger side (lower right) and around the pointer; grime collects at the base of the knob and in the gap around each button. Light comes from the top left, like on the panel.</span>
</div>
<div class="stage"><svg id="s" viewBox="0 0 1200 760"></svg></div>
<script>

/* ---- page layout ---- */
